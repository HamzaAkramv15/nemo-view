[package]
name = "yami-view"
version = "3.0.0"
edition = "2021"
description = "Fast image viewer and quick editor for Wayland"
license = "MIT"
publish = false

[[bin]]
name = "yami-view"
path = "src/main.rs"

[dependencies]
yami-px = { git = "https://github.com/Trendorin/yami-px", tag = "v3.0.0" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
